# Build do GSH Desktop para Linux x64: tarball com o bundle release, o
# install.sh e a integração de desktop (tool/package_linux_tarball.sh).
# Só manual e chamado pelo release.yml; não roda em push.
name: linux

on:
  workflow_dispatch:
  # Chamado pelo release.yml (releases por tag).
  workflow_call:

# Via workflow_call, github.workflow é o do chamador ("release").
concurrency:
  group: ${{ github.workflow }}-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Toolchain do Flutter desktop Linux + -dev que os plugins pedem no CMake:
      # libsecret (flutter_secure_storage), ALSA (volume_controller),
      # mpv/epoxy (media_kit_video), jsoncpp (bundle Flutter).
      - name: Dependências de build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libasound2-dev libmpv-dev libepoxy-dev libjsoncpp-dev

      # Fixado: o projeto não compila na 3.47 (pins como sqlite3 ^3.5.2).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # cli/ (crate Rust) vira gsh-cli no CMake.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # libghostty com `source: compile` exige exatamente Zig 0.16.0.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: flutter pub get
      - run: flutter build linux --release
      - run: tool/package_linux_tarball.sh

      - name: Upload (tarball)
        uses: actions/upload-artifact@v4
        with:
          name: gsh-linux-x64
          path: dist/GSH-Desktop-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
