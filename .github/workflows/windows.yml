# Build do GSH Desktop para Windows (x64, não assinado).
# Gera dois artefatos: a pasta Release (portátil, roda direto do gsh.exe) e o
# instalador Inno Setup via Fastforge (windows/packaging/exe/make_config.yaml).
name: windows

on:
  push:
    branches: [helio]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  # Chamado pelo release.yml (releases por tag).
  workflow_call:

# Via workflow_call, github.workflow é o do chamador ("release"): o build da
# release não cancela nem é cancelado pelo build avulso do mesmo ref.
concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Fixado: o projeto não compila na 3.47 (pins como sqlite3 ^3.5.2).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # cli/ (crate Rust) vira gsh-cli.exe no CMake.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # libghostty com `source: compile` exige exatamente Zig 0.16.0.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: flutter pub get
      # O build baixa dependências do Ghostty pela rede (zig fetch), e o
      # cliente HTTP do Zig falha neste runner em deps.files.ghostty.org.
      # Depois de uma falha, o prefetch baixa tudo com o curl direto no cache
      # que o hook do libghostty passa ao Zig, e o build tenta de novo.
      - name: flutter build windows --release
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
        run: |
          for i in 1 2 3; do
            flutter build windows --release && exit 0
            echo "::warning::build falhou na tentativa $i; baixando as dependências do Ghostty e tentando de novo"
            bash tool/prefetch_zig_deps.sh
          done
          exit 1

      # CRT do VC++ app-local (deploy permitido pela Microsoft): sem isto o
      # gsh.exe e a CLI Rust não abrem em máquina sem o VC++ Redistributable.
      - name: VC++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          $dlls = 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll' | ForEach-Object { Join-Path $crt.FullName $_ }
          foreach ($dest in 'build\windows\x64\runner\Release', 'build\windows\x64\runner\Release\gsh-server-bundle\bin') {
            Copy-Item $dlls $dest -ErrorAction Stop
          }

      - name: Upload (portátil)
        uses: actions/upload-artifact@v4
        with:
          name: gsh-windows-x64-portable
          path: build/windows/x64/runner/Release
          retention-days: 14

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      # --skip-clean: reaproveita o build acima (o Fastforge rebuilda incremental).
      - name: Instalador (Fastforge)
        run: |
          dart pub global activate fastforge
          dart pub global run fastforge:main package --platform windows --targets exe --skip-clean

      - name: Upload (instalador)
        uses: actions/upload-artifact@v4
        with:
          name: gsh-windows-x64-setup
          path: dist/**/*.exe
          retention-days: 14
          if-no-files-found: error
